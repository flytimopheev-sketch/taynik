[package]
name = "redpass"
version = "1.0.0"
edition = "2021"
description = "RedPass — офлайн-менеджер паролей для РЕД ОС"
license = "GPL-3.0-or-later"

[dependencies]
gtk4 = "0.9"
glib = "0.20"
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
zeroize = "1"

[profile.release]
lto = true
strip = true
