name: build-rpm

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  rpm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Установка зависимостей (без docker, прямо на раннере GitHub)
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm pkg-config libgtk-4-dev gcc
          python3 -m pip install --user cargo-zigbuild ziglang || python3 -m pip install --break-system-packages --user cargo-zigbuild ziglang || pip3 install --break-system-packages cargo-zigbuild ziglang
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          ls -l $HOME/.local/bin || true
          $HOME/.local/bin/cargo-zigbuild --version || true
          test -x $HOME/.local/bin/cargo-zigbuild || (command -v cargo-zigbuild) || { echo "cargo-zigbuild не установлен"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Версия
        run: |
          VER=$(grep -m1 '^version' Cargo.toml | sed 's/version *= *//; s/"//g')
          echo "VER=$VER" >> $GITHUB_ENV

      - name: Сборка исходного tarball (с vendored-зависимостями)
        run: sh packaging/make-source-tarball.sh

      - name: Сборка RPM
        run: |
          mkdir -p $HOME/rpmbuild/SOURCES
          cp taynik-$VER.tar.gz $HOME/rpmbuild/SOURCES/
          set -o pipefail
          rpmbuild -bb --nodeps -D "_topdir $HOME/rpmbuild" packaging/taynik.spec 2>&1 | tee rpmbuild.log || {
            echo "$VER" > .ver
            exit 1
          }

      - name: Диагностика (успех и провал)
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan ci-debug
          git reset --hard
          git rm -rf --cached . -q 2>/dev/null || true
          git add rpmbuild.log 2>/dev/null || true
          git add rpm-requires.txt 2>/dev/null || true
          git commit -m "rpmbuild log $VER" || true
          git push -f origin ci-debug || true

      - name: Копирование артефактов
        run: |
          mkdir -p dist
          find $HOME/rpmbuild/RPMS -name '*.rpm' -exec cp {} dist/ \;
          ls -l dist
          rpm -qp --requires dist/*.rpm | tee rpm-requires.txt || true
          # Защита от регрессии: RPM не должен требовать glibc новее 2.17
          if grep -qE 'GLIBC_2\.(1[8-9]|[2-9][0-9])' rpm-requires.txt; then
            echo "ОШИБКА: RPM требует слишком новую glibc:"; grep -E 'GLIBC_2\.(1[8-9]|[2-9][0-9])' rpm-requires.txt
            exit 1
          fi

      - name: Upload RPM (артефакт)
        uses: actions/upload-artifact@v4
        with:
          name: taynik-rpm
          path: dist/*.rpm
          if-no-files-found: error

      - name: GitHub Release (только для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.rpm
