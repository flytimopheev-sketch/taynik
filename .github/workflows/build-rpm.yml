name: build-rpm

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  rpm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Установка зависимостей (без docker, прямо на раннере GitHub)
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm pkg-config libgtk-4-dev gcc

      - name: Checkout
        uses: actions/checkout@v4

      - name: Версия
        run: |
          VER=$(grep -m1 '^version' Cargo.toml | sed 's/version *= *//; s/"//g')
          echo "VER=$VER" >> $GITHUB_ENV

      - name: Сборка исходного tarball (с vendored-зависимостями)
        run: sh packaging/make-source-tarball.sh

      - name: Сборка RPM
        run: |
          mkdir -p $HOME/rpmbuild/SOURCES
          cp taynik-$VER.tar.gz $HOME/rpmbuild/SOURCES/
          rpmbuild -bb --nodeps --define _topdir=$HOME/rpmbuild packaging/taynik.spec

      - name: Копирование артефактов
        run: |
          mkdir -p dist
          find $HOME/rpmbuild/RPMS -name '*.rpm' -exec cp {} dist/ \;
          ls -l dist

      - name: Upload RPM (артефакт)
        uses: actions/upload-artifact@v4
        with:
          name: taynik-rpm
          path: dist/*.rpm
          if-no-files-found: error

      - name: GitHub Release (только для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.rpm
