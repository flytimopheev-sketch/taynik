version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Мажорные версии зависимостей могут ломать сборку под glibc 2.17 —
    # обновляются вручную.
    ignore:
      - dependency-name: "gtk4"
        semver-major: true
      - dependency-name: "glib"
        semver-major: true
      - dependency-name: "rusqlite"
        semver-major: true

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
